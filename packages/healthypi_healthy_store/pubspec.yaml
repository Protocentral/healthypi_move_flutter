name: healthypi_healthy_store
description: >-
  Pure-Dart client for the ProtoCentral Healthy Store (HPI_HS), the MCUmgr group
  0x1000 on HealthyPi Move. Cursor-based sample sync, a self-describing metric
  registry, and CRC-verified raw-signal records. Bring your own transport.
version: 0.2.0
repository: https://github.com/Protocentral/healthy_store_dart
issue_tracker: https://github.com/Protocentral/healthy_store_dart/issues

environment:
  sdk: ^3.3.0

dependencies:
  # SMP framing, CBOR, seq matching, transport abstraction.
  mcumgr_dart: ^0.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.24.0
