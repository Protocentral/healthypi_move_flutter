Categories:
  - Connectivity
  - Sports & Health
License: MIT
AuthorName: ProtoCentral Electronics
WebSite: https://www.protocentral.com
SourceCode: https://github.com/Protocentral/healthypi_move_flutter
IssueTracker: https://github.com/Protocentral/healthypi_move_flutter/issues
Changelog: https://github.com/Protocentral/healthypi_move_flutter/blob/HEAD/CHANGELOG.md

RepoType: git
Repo: https://github.com/Protocentral/healthypi_move_flutter.git

Builds:
  - versionName: 3.0.9
    versionCode: 1097
    commit: v3.0.9
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/android-deploy.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --no-shrink --split-per-abi --target-platform=android-arm
        --dart-define=STORE_UPDATE_CHECKS=false

  - versionName: 3.0.9
    versionCode: 2097
    commit: v3.0.9
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/android-deploy.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --no-shrink --split-per-abi --target-platform=android-arm64
        --dart-define=STORE_UPDATE_CHECKS=false

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v\d+\.\d+\.\d+$
VercodeOperation:
  - '%c + 1000'
  - '%c + 2000'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 3.0.9
CurrentVersionCode: 2097
